<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>תרגול מבחן — LLMs, סוכנים וריבוי סוכנים</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --fg:#14181f; --muted:#6b7280; --line:#e2e5ea;
  --accent:#1f4e8c; --ok:#15803d; --okbg:#e8f5ec; --bad:#b91c1c; --badbg:#fdeced;
  --warn:#a16207; --warnbg:#fdf6e3;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12151a; --card:#1a1f27; --fg:#e6e9ee; --muted:#98a2b3; --line:#2b323d;
    --accent:#7aa7e0; --ok:#4ade80; --okbg:#132a1c; --bad:#f87171; --badbg:#2c1416;
    --warn:#fbbf24; --warnbg:#2a2312;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.65 "Segoe UI",Arial,sans-serif;padding:16px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);padding:8px 14px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{cursor:default;opacity:.55}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.qnum{font-size:13px;color:var(--muted);margin-bottom:6px}
.qtext{font-size:18px;font-weight:600;margin-bottom:14px}
ol.opts{list-style:none;margin:0;padding:0}
ol.opts li{margin-bottom:8px}
ol.opts button{display:flex;gap:10px;width:100%;text-align:right;padding:11px 13px;line-height:1.5}
ol.opts button .k{flex:0 0 22px;color:var(--muted);font-weight:700}
ol.opts button.correct{background:var(--okbg);border-color:var(--ok)}
ol.opts button.correct .k{color:var(--ok)}
ol.opts button.wrong{background:var(--badbg);border-color:var(--bad)}
ol.opts button.wrong .k{color:var(--bad)}
.why{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--okbg);
  border:1px solid var(--ok);font-size:15px}
.why .src{display:block;margin-top:7px;font-size:12px;color:var(--muted)}
.why.unver{background:var(--warnbg);border-color:var(--warn)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);margin-inline-start:6px;vertical-align:middle}
.tag.med{color:var(--warn);border-color:var(--warn)}
.tag.low{color:var(--bad);border-color:var(--bad);font-weight:700}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
label.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.big{font-size:32px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.filters input[type=search],.filters select{font:inherit;padding:7px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);color:var(--fg)}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.qcard{padding:16px 0;border-bottom:1px solid var(--line)}
.qcard:last-child{border-bottom:0}
.qcard .qtext{font-size:16px;margin:6px 0 10px}
.opt{display:flex;gap:10px;padding:8px 12px;border:1px solid var(--line);
  border-radius:8px;line-height:1.5}
.opt.correct{background:var(--okbg);border-color:var(--ok);font-weight:600}
.opt.correct .k{color:var(--ok)}
.opt .k{flex:0 0 22px;color:var(--muted);font-weight:700}
@media print{
  body{background:#fff;color:#000;padding:0}
  .modes,.filters,.hint{display:none}
  .card{border:0;padding:0}
  .qcard{break-inside:avoid;border-bottom:1px solid #ccc}
  .opt.correct{background:#eee;border-color:#000}
  .why{background:#f5f5f5;border-color:#999}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>תרגול מבחן — מערכות בינה מלאכותית מתקדמות</h1>

<script id="qs" type="application/json">[{"id": 1, "topic": "אתיקה ופרטיות", "conf": "high", "src": "ספר האתיקה, פרק 2 — כשהמכונה יודעת יותר מדי", "correct": 1, "q": "מנהל טוען שהארגון אינו עוקב אחר לקוחותיו משום שאין בו מצלמות. מדוע הטענה שגויה?", "opts": ["במצלמות המעקב הפיזיות המותקנות על קירות המבנים", "באלגוריתמים המנתחים כל בחירה וכל פעולה שאנו מבצעים", "בסוכנים חשאיים אנושיים המדווחים לשלטון על אזרחים חשודים", "בחוקי צנזורה ממשלתיים המגבילים את המידע המגיע לאזרח"], "why": "המעקב המודרני אינו פיזי אלא אלגוריתמי — כל קליק, חיפוש ורכישה נאספים ומנותחים. היעדר מצלמות אינו מעיד על היעדר מעקב."}, {"id": 2, "topic": "שבע כלכלות", "conf": "high", "src": "חוברת הרצאה 01, סעיף 5.5.1, עמ' 31", "correct": 3, "q": "ארגון מתאר שלב שבו תהליכי העבודה רצים ללא מעורבות אנושית כלל. מהי ההגדרה המדויקת של 'כלכלה 7' האוטונומית?", "opts": ["סוכני AI עובדים לצד בני אדם, אך בכמות מצומצמת יותר", "סוכני AI מייעצים בעוד בני אדם מקבלים את ההחלטות", "בני אדם עובדים ללא כלי AI, מתוך בחירה אידיאולוגית", "סוכני AI מבצעים את כל העבודה בלי בני אדם כלל"], "why": "לשון המקור חדה: 'כלכלה 7 היא כלכלה שבה סוכני AI עובדים בלי בני אדם בכלל. לא עם פחות בני אדם — בלי בני אדם.'"}, {"id": 3, "topic": "רגולציה ו-EU AI Act", "conf": "high", "src": "ספר האתיקה, פרק 4 — EU AI Act, Human-In-The-Loop", "correct": 3, "q": "מערכת בסיכון גבוה מתעדת כל החלטה ומאפשרת אישור בדיעבד. מה עוד נדרש כדי לעמוד בדרישת הפיקוח האנושי?", "opts": ["לאשר בדיעבד החלטה שהמערכת כבר ביצעה ללא אדם", "לתעד באופן מלא את המערכת ואת כל החלטותיה", "לבצע הערכת סיכונים ורישום של המערכת מראש בלבד", "לאפשר התערבות אדם בכל שלב של תהליך ההחלטה"], "why": "Human-In-The-Loop דורש יכולת התערבות בזמן אמת, בכל שלב. תיעוד ואישור בדיעבד הם דרישות נפרדות ואינם מחליפים את הפיקוח."}, {"id": 4, "topic": "ניהול מוצר", "conf": "high", "src": "חוברת הרצאה 10, סעיף 1.1 — Product Sense", "correct": 1, "q": "צוות מבקש לפתח את יכולת ה-Product Sense של חבריו. על אילו שני עמודי תווך עליו להשעין את המאמץ?", "opts": ["אמפתיה, Empathy, ותעדוף מדדי — KPIs", "נתונים, Data, ואינטואיציה — Intuition", "אמפתיה, Empathy, ויצירתיות — Creativity", "מהירות, Speed, ודיוק — Accuracy"], "why": "תחושת מוצר נשענת על שילוב של נתונים קשיחים ואינטואיציה שנבנתה מניסיון — לא על אחד מהם לבדו."}, {"id": 5, "topic": "פרומפטים ו-LLM", "conf": "high", "src": "סיכום הרצאה 05 — מטפורת 'היער של המסלולים'", "correct": 1, "q": "שני מנהלים פותחים בקשה בהנחיה שונה ומקבלים 'מסלול' ותשובה שונים. במטאפורת הכבישים, מה ממלא את תפקיד 'נקודת ההתחלה' שקובעת את המסלול?", "opts": ["הגדרת הטמפרטורה והיצירתיות", "הפרומפט שהמשתמש מזין", "משקלי המודל שנקבעו באימון", "הנחיית המערכת שהוגדרה למודל"], "why": "במטאפורה, היער והמסלולים הם המודל הקבוע; הפרומפט הוא נקודת הכניסה שקובעת באיזה מסלול תצעד ולאן תגיע."}, {"id": 6, "topic": "מולטימדיה ו-Vibe Coding", "conf": "high", "src": "חוברת מולטימדיה Vibe-Coding — כתיבת ליריקה", "correct": 3, "q": "מה הופך פרומפט לכתיבת ליריקה ל'טוב' לפי הפרק, כזה שהופך את המבקש ל'מנהל מפרט'?", "opts": ["הזנת מילות השיר המוגמרות ובקשה מהמודל להלחין להן מנגינה", "מתן דוגמה של שיר מצליח קיים ובקשה מהמודל לחקות את סגנונו במדויק", "בקשה חופשית וכללית לשיר יפה, המשאירה למודל מירב חופש יצירתי", "פירוק המשימה לרכיביה: נושא רגשי, מבנה רצוי, טכניקת חריזה וקהל יעד"], "why": "'מנהל מפרט' מגדיר דרישות מדידות. פירוק המשימה לרכיבים הוא בדיוק ההבדל בין בקשה עמומה לבין מפרט שאפשר לבצע ולבדוק."}, {"id": 7, "topic": "API ו-MCP", "conf": "high", "src": "סיכום הרצאה 06 — ארכיטקטורת שרת-לקוח", "correct": 1, "q": "מהנדס מגדיר דרישת אבטחה בסיסית לארכיטקטורת שרת--לקוח: מי משני הצדדים רשאי לפתוח בפנייה?", "opts": ["כל לקוח משרת שרת אחד בלבד ביחס של אחד-לאחד", "שרת לעולם אינו יוזם — רק הלקוח יוזם והשרת מגיב", "לקוח לעולם אינו יוזם — רק השרת יוזם ושולח עדכונים", "השרת שומר את ה-Context Window של הלקוח ומעבירו ל-LLM"], "why": "בבסיס המודל השרת פסיבי: הוא מאזין ומגיב. שרת שיוזם פנייה אל לקוח הוא בדיוק דפוס התקיפה שהארכיטקטורה נועדה למנוע."}, {"id": 8, "topic": "גרף ידע ומוח שני", "conf": "high", "src": "סיכום הרצאה 12 — Graphify, AST", "correct": 0, "q": "צוות צריך לנתח בסיס קוד פייתון ענק אך אינו רוצה לשלם כמעט טוקנים ואינו יכול להריץ את הקוד. באיזו טכניקה Graphify ממפה את מבנה הקוד?", "opts": ["עץ תחביר מופשט, AST, המפרק את הקוד למבנה לוגי ללא הרצתו", "הרצת הקוד ומעקב אחר כל הקריאות בזמן אמת — dynamic tracing", "מדידת המרחק הקוסינוסי בין קטעי הקוד השונים", "פירוק סטטי של הקוד לשלשות RDF סמנטיות ללא הרצתו"], "why": "AST הוא ניתוח סטטי ודטרמיניסטי: הפרסר קורא את הקוד ובונה עץ לוגי — בלי הרצה ובלי עלות טוקנים."}, {"id": 9, "topic": "ארכיטקטורת סוכנים", "conf": "high", "src": "סיכום הרצאה 05 — LLM לעומת סוכן", "correct": 0, "q": "צוות עוטף LLM ביכולת קריאה, כתיבה, האזנה והרצת כלים. מהו ההבדל המהותי מ-LLM עירום?", "opts": ["הוא פועל בעולם: שומע, רואה, לוחץ ומריץ כלים", "הוא משתמש במודל שפה שונה לכל סוג של משימה", "הוא עובר אימון מחדש על נתוני המשתמש בכל פעולה", "הוא קורא לאותו LLM מספר פעמים ברצף אך ללא כלים"], "why": "ההבדל הוא היכולת לפעול. LLM לבדו רק חושב ומגיב בטקסט; הכלים הם מה שהופך אותו לסוכן שמשפיע על העולם."}, {"id": 10, "topic": "LLM מקומי ו-AirLLM", "conf": "high", "src": "מצגת 2 (ניהול זיכרון), שקופית 11 — Cache Hit מול Cache Miss", "correct": 3, "q": "צוות מודד שאותה שכבה נטענת פעם במיליוניות שנייה ופעם באיטיות רבה. מה מבדיל בפועל בין Hit ל-Miss?", "opts": ["בין מודל שנטען במלואו ל-VRAM לבין מודל שנטען שכבה-אחר-שכבה", "בין קריאה מדיסק NVMe לבין קריאה מדיסק SATA איטי יותר", "בין כתובת וירטואלית לבין הכתובת הפיזית התואמת ב-RAM", "בין חישוב מהיר לבין המתנה ארוכה לפעולת I/O מהאחסון"], "why": "ציטוט מהמצגת: 'ההבדל בין Hit ל-Miss הוא לעיתים ההבדל בין חישוב מהיר לבין המתנה ל-I/O.'"}, {"id": 11, "topic": "API ו-MCP", "conf": "high", "src": "סיכום הרצאה 06 — API מול MCP", "correct": 1, "q": "צוות שוקל לעבור מ-API ישיר ל-MCP. מהם היתרונות המרכזיים של המעבר?", "opts": ["אבטחה גבוהה יותר של שלושת השדות הסודיים", "גמישות, דינמיות והפחתת כמות הקוד הנדרש", "ביטול הצורך ב-Token ובמפתחות סודיים כלשהם", "הרצה מקומית של מודל השפה ללא כל תלות בענן"], "why": "MCP מחליף קוד אינטגרציה ייעודי בפרוטוקול אחיד שהסוכן מגלה בזמן ריצה. הטוקנים והסודות עדיין נדרשים."}, {"id": 12, "topic": "אבטחת סוכנים", "conf": "high", "src": "ספר האתיקה, פרק 6 — Defense in Depth", "correct": 3, "q": "In a layered Defense-in-Depth design for an agent, which layer intercepts the incoming request first, before any other component handles it?", "opts": ["Human review of the request after tool execution", "Guardrails & Output Filtering on responses", "Rate limiting applied after response logging", "Input Validation & Sanitization of requests"], "why": "בהגנה לעומק הקלט נבדק ראשון — לפני שהוא מגיע למודל או לכלים. שאר השכבות פועלות על הפלט או בדיעבד."}, {"id": 13, "topic": "API ו-MCP", "conf": "med", "src": "סיכום הרצאה 06 — מטלת Gmail→Calendar", "correct": 1, "q": "לפי השיעור, חוקים קלאסיים המבוססים על שולח ומילות מפתח מזהים נכון רק כ-40% מהמקרים. מה בדיוק הם מתקשים לזהות?", "opts": ["האם התאריך המבוקש בלוח השנה פנוי או תפוס", "האם מייל הוא הזמנה לפגישה או מייל רגיל", "לאיזו תיקייה בתיבה יש לשייך את המייל הנכנס", "האם המייל נשלח מכתובת פנימית או חיצונית"], "why": "זו בדיוק המשימה שבגללה נדרש LLM במטלה: הבנת כוונה — האם הטקסט מהווה זימון לפגישה — ולא התאמת מילות מפתח."}, {"id": 14, "topic": "LLM מקומי ו-AirLLM", "conf": "high", "src": "מצגת 3 (AirLLM), שקופית 20 — Hugging Face Token", "correct": 1, "q": "מנהל אבטחה בודק כיצד קוד הצוות מטפל במפתח הגישה ל-Hugging Face. איזו התנהלות נחשבת נכונה?", "opts": ["לשמור אותו בתוך ה-Modelfile כדי שיהיה זמין לכל הרצה", "לא לשמור אותו גלוי בקוד — להשתמש במשתני סביבה או ב-login מאובטח", "לשלוח אותו בהודעת צ'אט לחברי הצוות כדי שכולם יוכלו להריץ מקומית", "לשמור אותו בקובץ קוד פרטי בתוך המאגר ולסמוך על הרשאות הריפו בלבד"], "why": "ציטוט מהמצגת: 'אין לשמור token גלוי בקוד, במחברת או במצגת; עדיף להשתמש במשתני סביבה או במנגנון login מאובטח. Token הוא סוד גישה — מתייחסים אליו כמו סיסמה.'"}, {"id": 15, "topic": "ניהול סיכונים", "conf": "high", "src": "ספר האתיקה, סעיף 3.7 — Risk Score = (I×P×E)/100", "correct": 3, "q": "A risk officer scores a new agent and must interpret the variable P in the Risk Score formula  ומיקרופון", "לדיסק הקשיח - ספריית הידע הגדולה של הסוכן"], "why": "Tools הם ערוצי הקלט/פלט של הסוכן — בדיוק כמו התקני I/O במחשב. חלון ההקשר הוא ה-RAM ו-RAG הוא הדיסק."}, {"id": 19, "topic": "מולטימדיה ו-Vibe Coding", "conf": "high", "src": "חוברת הרצאה 10, סעיף 4.2 — Google Flow ו-Veo", "correct": 0, "q": "מנהלת מתכננת מקטעי תסריט לסרט תדמית שייווצר בכלי טקסט-לווידאו. באיזה אורך מקטע לבחור ומדוע?", "opts": ["8-10 שניות, בהתאם למגבלות של כלי יצירת הווידאו מטקסט", "30-40 שניות, בהתאם למגבלות מכסת המנוי החינמית של הכלי בחודש", "2-3 שניות, בהתאם לזמן הרינדור המהיר ביותר של המנוע", "60 שניות, בהתאם לאורך המרבי המותר בפלטפורמות השיתוף החברתיות"], "why": "התסריט מפורק לפי מגבלת הכלי הטכנית — Veo מפיק קטע של כ-8-10 שניות בכל הרצה, ולכן זו יחידת התכנון."}, {"id": 20, "topic": "אתיקה ופרטיות", "conf": "high", "src": "ספר האתיקה, סעיף 2.4 — עקרונות אתיים", "correct": 1, "q": "מנהל מצדיק ניסוי בעובדים ללא ידיעתם בטענה שהתועלת הכוללת גדולה. איזה עקרון אתי הוא מפר?", "opts": ["המטרה מקדשת את האמצעים כאשר התועלת העסקית הצפויה גדולה מספיק", "אל תתייחס לאדם כאמצעי בלבד, אלא תמיד גם כאל מטרה בפני עצמה", "בחר תמיד בפעולה שתביא את התועלת המרבית למספר הגדול ביותר של בני אדם", "פעל תמיד לפי הנורמות שהחברה שבה אתה חי קיבלה על עצמה"], "why": "זהו הצו הקטגורי הקנטיאני. ניסוי בעובדים ללא הסכמה מפר אותו בדיוק — התועלת הכוללת אינה מכשירה זאת."}, {"id": 21, "topic": "אתיקה ופרטיות", "conf": "high", "src": "ספר האתיקה, סעיף 1.3 — מקרה Air Canada", "correct": 0, "q": "חברת תעופה טענה בבית משפט שאין היא אחראית לטעות שהשמיע הצ'אטבוט שלה. כיצד פסק בית המשפט?", "opts": ["הסוכן הוא זרוע של הארגון, והחברה אחראית לדבריו כמו לדברי נציג אנושי", "האחריות חלה על ספק המודל שפיתח את הבוט ולא על החברה שהפעילה אותו", "החברה פטורה מאחריות משום שהוצג ללקוח כתב ויתור על דיוק תשובות הבוט", "החברה אינה אחראית משום שהבוט הוא ישות משפטית נפרדת האחראית לדבריה"], "why": "לשון הספר: טענת 'זה הבוט' אינה עומדת בשום מבחן משפטי. הפסיקה קבעה סטנדרט עולמי — הארגון אחראי לכל מילה של הסוכן שלו."}, {"id": 22, "topic": "פרומפטים ו יוק הנימוק שהעיקרון פוסל."}, {"id": 29, "topic": "מסמכים ו-LaTeX", "conf": "high", "src": "סיכום הרצאה 07 — Plain Text מול Rich Text", "correct": 2, "q": "מנהל שם לב שהסוכן עורך קבצי Markdown ו-LaTeX בקלות אך מתקשה עם .docx ו-.pdf. מדוע פורמטים אלה נחשבים יתרון לעבודת סוכנים?", "opts": ["הם פורמטים עשירים, Rich Text, המכילים עיצוב מובנה ולכן קלים לסוכן", "הם בינאריים דחוסים, ולכן קלים יותר לעיבוד מהיר על ידי המודל", "הם מבוססי טקסט, ולכן הסוכן מייצר ועורך אותם ישירות ללא ממשק גרפי", "הם נפתחים רק בעורך ייעודי ששומר על עיצוב אחיד עבור הסוכן"], "why": "Markdown ו-LaTeX הם Plain Text — הסוכן קורא, כותב ומשווה אותם כטקסט, וגם Git עוקב אחריהם שורה-שורה."}, {"id": 30, "topic": "אתיקה ופרטיות", "conf": "high", "src": "ספר האתיקה, פרק 3 — HIPAA ומידע רפואי", "correct": 2, "q": "מדוע תיק רפואי גנוב מתומחר בשוק השחור גבוה בהרבה ממספר כרטיס אשראי גנוב?", "opts": ["משום שהתיק כולל בתוכו גם את מספר כרטיס האשראי של המטופל לניצול מיידי", "משום שתיק רפואי מכיל יותר בתים של מידע ולכן מחירו גבוה יותר", "כרטיס אשראי אפשר לבטל מיד, אך היסטוריה רפואית דבקה באדם לכל חייו", "משום שתקנות HIPAA מחייבות פיצוי כספי גבוה לכל מטופל שתיקו נגנב"], "why": "ההבדל הוא בהפיכות: כרטיס מבטלים בשיחה אחת, אבחנה רפואית לא ניתן 'לבטל'. הנזק נמשך כל החיים ולכן השווי גבוה."}, {"id": 31, "topic": "CrewAI", "conf": "high", "src": "סיכום הרצאה 08, סעיף 9.3 — סוגי תהליך ב-Crew", "correct": 0, "q": "בהרכבת הצוות נכתב process=Process.sequential. איזו התנהגות ריצה זה מכתיב?", "opts": ["המשימות רצות ברצף, וכל תוצר מוזרם לשלב הבא", "המשימות רצות במקביל ומתאחדות לתוצר אחד בסוף ההרצה", "סוכן מנהל מקצה כל משימה לסוכן המתאים לה", "המשימות רצות ברצף אך כל אחת מתחילה מהקשר ריק"], "why": "לשון המקור: 'סדרתי (Sequential) — טורי: כל סוכן מסיים ומעביר את התוצר לבא אחריו.' ההעברה נעשית דרך ה-context."}, {"id": 32, "topic": "בדיקות ואיכות", "conf": "med", "src": "סיכום הרצאה 08 — מעבר לייצור", "correct": 1, "q": "מנהל רוצה לוודא שהסוכן חסין למגוון מקרי קצה לפני עלייה לאוויר. איך נקראת סדרת הבדיקות העמוקה לכך?", "opts": ["פרוף-או החלטה הזו') אינו דמיון נושאי — הוא קשת מפורשת בגרף."}, {"id": 90, "topic": "CrewAI", "conf": "high", "src": "סיכום הרצאה 08, פרק 9 — ארבעת הרכיבים", "correct": 0, "q": "מפתח ממפה את אבני הבניין של קרו-איי, CrewAI, לפני שהוא כותב קוד. איזו רשימה מונה את ארבעת חלקיו המרכזיים?", "opts": ["Agents, Tasks, Crew, Process", "Training, Inference, Polling, Scheduler", "Role, Goal, Backstory, Tools", "LangChain, LangGraph, MCP, A2A"], "why": "ארבעת הרכיבים: סוכנים, משימות, צוות ותהליך ההרצה. מסיח c מונה את ארבעת שדות ההגדרה של סוכן בודד — רמה אחת למטה."}, {"id": 91, "topic": "מטלות הקורס", "conf": "high", "src": "סיכום הרצאה 07, סעיף 14 — מטלה #4", "correct": 1, "q": "סטודנט בודק אם המסמך הסופי שלו עומד בדרישת האורך של מטלה #04; מהי הדרישה.", "opts": ["לפחות 30 עמודים באנגלית, או 50 עמודים בעברית-אנגלית מעורב", "לפחות 50 עמודים באנגלית, או 30 עמודים בעברית-אנגלית מעורב", "לפחות 40 עמודים בכל שפה, ללא הבחנה בין עברית לאנגלית", "לפחות 50 עמודים בעברית, ללא דרישת מינימום למסמך באנגלית"], "why": "ציטוט מהמקור: 'אורך: לפחות 50 עמודים (English) או 30 עמודים (עברית-אנגלית מעורב).'"}, {"id": 92, "topic": "מערכות הפעלה", "conf": "high", "src": "סיכום הרצאה 06 — מכונת מצבים", "correct": 1, "q": "מרצה מבקש דוגמה למכונת מצבים — State Machine. איזו דוגמה ממחישה זאת בצורה הטובה ביותר?", "opts": ["מודל שפה שמנבא את המילה הבאה לפי הסתברות בכל צעד", "מכונת משקאות העוברת ממצב המתנה למטבע, לבחירת משקה, ואז למצב הבא", "מחשבון שמחזיר תוצאה שונה לכל קלט בלי לשמור מצב קודם", "פס ייצור שמופעל בפקודה אחת ומפיק תוצרים רבים בבת אחת ללא שלבים"], "why": "מכונת מצבים = קבוצת מצבים סופית ומעברים מוגדרים ביניהם. מכונת המשקאות היא הדוגמה הקנונית; מחשבון חסר-מצב הוא ההפך."}, {"id": 93, "topic": "LLM מקומי ו-AirLLM", "conf": "high", "src": "מצגת 3 (AirLLM), שקופית 2 — נקודת המוצא", "correct": 0, "q": "מנהל מנסה להריץ מודל שאינו נכנס ל-VRAM ושואל מהי נקודת המוצא ש-AirLLM מציע לבעיה. מהי?", "opts": ["צריך לשנות את דרך טעינת המודל, לא רק לכווץ אותו", "צריך להקטין את חלון ההקשר כדי שהמודל ייכנס לזיכרון הכרטיס", "צר topic": "פרומפטים ו-LLM", "conf": "high", "src": "סיכום הרצאה 12 — 'אבוד באמצע'", "correct": 1, "q": "מנהלת מזינה פרומפט ארוך מאוד ובו עשרים הנחיות. אילו הנחיות יילקחו בפועל בחשבון?", "opts": ["הפרומפט נחתך בקצה הישן כשהוא ארוך מדי", "הטוקנים בהתחלה ובסוף נלקחים בחשבון והאמצע נשכח", "המודל ממציא מידע שלא הוזן כלל בפרומפט", "תשומת הלב של המודל דועכת באופן אחיד לאורך הפרומפט"], "why": "Lost in the Middle: תשומת הלב אינה אחידה אלא בצורת U — חזקה בקצוות וחלשה באמצע. ההנחיות שבאמצע נוטות ליפול."}, {"id": 178, "topic": "שבע כלכלות", "conf": "high", "src": "חוברת הרצאה 01, סעיף 5.2.1 — כלכלה 1: הכלכלה האורגנית", "correct": 3, "q": "מהי הקבוצה שמאפיינת את הכלכלה הראשונה במודל שבע הכלכלות?", "opts": ["קבוצות קטנות של מפוטרים שמקימים חברת AI-native", "מפעיל יחיד שמנהל עשרות סוכנים אוטונומיים לבדו", "חברות ותיקות ששורפות את המבנה ומאמצות AI אגרסיבית", "אנשים שנמאס להם מהטכנולוגיה וחוזרים לעבודת כפיים"], "why": "הכלכלה האורגנית היא בחירה אידיאולוגית מודעת: חקלאות אורגנית, עבודת יד, אומנות מסורתית. המסיחים הם כלכלות 6, 7 ו-5."}, {"id": 179, "topic": "LLM מקומי ו-AirLLM", "conf": "high", "src": "סיכום הרצאה 11, סעיף 5.2 — דיוק מספרי ורוחב סיביות", "correct": 1, "q": "צוות מכווץ מודל כדי שייכנס לכרטיס קטן, ומדווח על ירידה קלה בדיוק. איזו פעולה בוצעה במשקלים?", "opts": ["אריזת המשקלים, הטוקנייזר והמטא-נתונים לכדי קובץ יחיד", "הקטנת רוחב הסיביות המייצג את המשקלים במחיר אובדן מבוקר של דיוק", "חלוקת המודל בין זיכרון רגיל לזיכרון גרפי בהתאם לגודלו", "הקטנת מספר הליבות שהמודל מנצל בזמן ההרצה כדי לחסוך חשמל"], "why": "זו קוונטיזציה: מעבר מ-FP16 ל-8bit או 4bit. פחות סיביות לכל משקל = פחות זיכרון, במחיר דחיסה מאבדת מידע."}, {"id": 180, "topic": "גרף ידע ומוח שני", "conf": "high", "src": "סיכום הרצאה 12 — תצוגת גרף מול עץ תיקיות", "correct": 3, "q": "צוות מתלבט אם לנווט בידע דרך תצוגת הגרף או דרך עץ התיקיות. מה היתרון המרכזי של תצוגת הגרף?", "opts": ["הגרף מסדר את הפתקים לפי סדר אלפביתי ומייתר את החיפוש", "הגרף אוכף לכל פתק מיקום היררכי יחיד, בדיוק כמו עץ התיקיות", "הגרף מקצר את זמן הטעינה <script>
const QS = JSON.parse(document.getElementById('qs').textContent);
const LS = 'biu-llm-quiz-v1';
const KEYS = ['a','b','c','d'];

let st = load();
function load(){ try{ return JSON.parse(localStorage.getItem(LS)) || {} }catch{ return {} } }
function save(){ localStorage.setItem(LS, JSON.stringify(st)) }
function rec(id){ return st[id] || (st[id] = {box:1, seen:0, right:0, wrong:0, flag:false}) }

let mode='practice', queue=[], pos=0, answered=null, examStart=0, examLog=[];
const panel = document.getElementById('panel');

document.querySelectorAll('.modes button[data-mode]').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.modes button[data-mode]').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    mode = b.dataset.mode;
    start();
  };
});
document.getElementById('reset').onclick = ()=>{
  if(!confirm('לאפס את כל ההתקדמות והסטטיסטיקה?')) return;
  st = {}; save(); start();
};

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]] } return a }

// Leitner: box 1 drawn 5x as often as box 3. Unseen questions come first.
function practiceQueue(){
  const pool = [];
  for(const q of QS){
    const r = st[q.id];
    const w = !r ? 6 : (r.box===1 ? 5 : r.box===2 ? 2 : 1);
    for(let i=0;i<w;i++) pool.push(q);
  }
  const out=[], used=new Set();
  shuffle(pool);
  for(const q of pool){ if(!used.has(q.id)){ used.add(q.id); out.push(q) } }
  return out;
}

function start(){
  answered=null; pos=0; examLog=[];
  if(mode==='stats') return renderStats();
  if(mode==='browse') return renderBrowse();
  if(mode==='exam'){ queue = shuffle(QS.slice()); examStart = Date.now(); }
  else if(mode==='review'){
    queue = shuffle(QS.filter(q=>{ const r=st[q.id]; return r && (r.wrong>0 || r.flag) }));
    if(!queue.length){
      panel.innerHTML = '<p>אין עדיין שאלות שטעית בהן או שסימנת. התחל בתרגול.</p>';
      return;
    }
  }
  else queue = practiceQueue();
  render();
}

function render(){
  if(pos >= queue.length) return mode==='exam' ? renderExamResults() : renderDone();
  const q = queue[pos], r = rec(q.id);
  const unver = q.conf !== 'high';
  const confTag = q.conf==='high' ? '' :
    `<span class="tag ${q.conf}">${q.conf==='med' ? 'ודאות בינונית' : 'לא מאומת — בדוק'}</span>`;

  panel.innerHTML = `
    <div class="meta">
      <span>${modeName()} · ${pos+1} מתוך ${queue.length}</span>
      <span>${q.topic}${mode!=='exam'?confTag:''}</span>
    </div>
    <div class="bar"><i style="width:${(pos/queue.length*100).toFixed(1)}%"></i></div>
    <div class="qnum">שאלה #${q.id}${mode==='exam'?'':` · תיבה ${r.box}/3 · נכון ${r.right} · טעות ${r.wrong}`}</div>
    <div class="qtext">${esc(q.q)}</div>
    <ol class="opts">${q.opts.map((o,i)=>
      `<li><button data-i="${i}"><span class="k">${KEYS[i]}.</span><span>${esc(o)}</span></button></li>`).join('')}</ol>
    <div id="after"></div>
    <div class="foot">
      <label class="chk"><input type="checkbox" id="flag" ${r.flag?'checked':''}> סמן לבדיקה (f)</label>
      <button id="next" disabled>הבא ←</button>
    </div>
    <div class="hint">מקשים: 1-4 לבחירת תשובה · Enter לשאלה הבאה · f לסימון</div>`;

  panel.querySelectorAll('ol.opts button').forEach(b=> b.onclick = ()=> pick(+b.dataset.i));
  document.getElementById('flag').onchange = e=>{ rec(q.id).flag = e.target.checked; save() };
  document.getElementById('next').onclick = next;
}

function pick(i){
  if(answered !== null) return;
  answered = i;
  const q = queue[pos], r = rec(q.id), ok = i === q.correct;

  r.seen++; ok ? r.right++ : r.wrong++;
  r.box = ok ? Math.min(3, r.box+1) : 1;
  save();
  if(mode==='exam') examLog.push({id:q.id, ok});

  const btns = panel.querySelectorAll('ol.opts button');
  btns.forEach(b=>b.disabled = true);
  btns[q.correct].classList.add('correct');
  if(!ok) btns[i].classList.add('wrong');

  if(mode !== 'exam'){
    document.getElementById('after').innerHTML =
      `<div class="why${q.conf!=='high'?' unver':''}">${esc(q.why)}
        <span class="src">מקור: ${esc(q.src)}</span></div>`;
  }
  document.getElementById('next').disabled = false;
  document.getElementById('next').focus();
}

function next(){ answered=null; pos++; render() }

function renderDone(){
  panel.innerHTML = `<p>סיימת את כל ${queue.length} השאלות במצב זה.</p>
    <button onclick="location.reload()">סבב חדש</button>`;
}

function renderExamResults(){
  const right = examLog.filter(x=>x.ok).length;
  const mins = Math.round((Date.now()-examStart)/60000);
  const missed = examLog.filter(x=>!x.ok).map(x=>x.id).sort((a,b)=>a-b);
  panel.innerHTML = `
    <div class="big">${right} / ${examLog.length}</div>
    <p>${(right/examLog.length*100).toFixed(1)}% · ${mins} דקות</p>
    <p><b>שאלות שטעית בהן:</b><br>${missed.length ? missed.map(i=>'#'+i).join(', ') : 'אף אחת.'}</p>
    <p>עבור למצב "חזרה על טעויות" כדי לתרגל אותן.</p>
    <button onclick="location.reload()">מבחן חדש</button>`;
}

function renderStats(){
  const seen = QS.filter(q=>st[q.id]?.seen);
  const mastered = QS.filter(q=>st[q.id]?.box===3);
  const byTopic = {};
  for(const q of QS){
    const t = byTopic[q.topic] || (byTopic[q.topic]={n:0, right:0, wrong:0});
    t.n++;
    const r = st[q.id];
    if(r){ t.right += r.right; t.wrong += r.wrong }
  }
  const unver = QS.filter(q=>q.conf!=='high');
  panel.innerHTML = `
    <div class="meta"><span>נראו ${seen.length}/${QS.length}</span><span>בתיבה 3 (שונן): ${mastered.length}</span></div>
    <div class="bar"><i style="width:${(mastered.length/QS.length*100).toFixed(1)}%"></i></div>
    <table><tr><th>נושא</th><th>שאלות</th><th>נכון</th><th>טעות</th><th>דיוק</th></tr>
    ${Object.entries(byTopic).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>{
      const tot = v.right+v.wrong;
      return `<tr><td>${esc(k)}</td><td>${v.n}</td><td>${v.right}</td><td>${v.wrong}</td>
        <td>${tot? (v.right/tot*100).toFixed(0)+'%' : '—'}</td></tr>`;
    }).join('')}</table>
    <p style="margin-top:16px"><b>שאלות לא מאומתות מול המקורות (${unver.length}):</b><br>
      ${unver.map(q=>`#${q.id}`).join(', ') || 'אין.'}</p>`;
}

// --- browse: every question with its answer, searchable ---
let brQ='', brTopic='', brConf='', brHide=false;

function renderBrowse(){
  const topics = [...new Set(QS.map(q=>q.topic))].sort();
  panel.innerHTML = `
    <div class="filters">
      <input id="brq" type="search" placeholder="חיפוש בשאלות, בתשובות ובהסברים…" value="${esc(brQ)}">
      <select id="brtopic"><option value="">כל הנושאים</option>${
        topics.map(t=>`<option value="${esc(t)}"${t===brTopic?' selected':''}>${esc(t)}</option>`).join('')}</select>
      <select id="brconf"><option value="">כל רמות הוודאות</option>
        <option value="high"${brConf==='high'?' selected':''}>מאומת (high)</option>
        <option value="med"${brConf==='med'?' selected':''}>ודאות בינונית (med)</option>
        <option value="low"${brConf==='low'?' selected':''}>לא מאומת (low)</option></select>
      <label class="chk"><input type="checkbox" id="brhide" ${brHide?'checked':''}> הסתר תשובות</label>
      <button id="brprint">הדפסה / PDF</button>
    </div>
    <div id="brlist"></div>`;

  const on = (id,ev,fn)=>document.getElementById(id).addEventListener(ev,fn);
  on('brq','input', e=>{ brQ=e.target.value; paintBrowse() });
  on('brtopic','change', e=>{ brTopic=e.target.value; paintBrowse() });
  on('brconf','change', e=>{ brConf=e.target.value; paintBrowse() });
  on('brhide','change', e=>{ brHide=e.target.checked; paintBrowse() });
  on('brprint','click', ()=>window.print());
  paintBrowse();
}

function browseMatches(){
  const needle = brQ.trim().toLowerCase();
  return QS.filter(q=>{
    if(brTopic && q.topic !== brTopic) return false;
    if(brConf && q.conf !== brConf) return false;
    if(!needle) return true;
    return (q.q + ' ' + q.opts.join(' ') + ' ' + q.why + ' ' + q.src + ' #' + q.id)
      .toLowerCase().includes(needle);
  });
}

function paintBrowse(){
  const list = browseMatches();
  const confLabel = {high:'מאומת', med:'ודאות בינונית', low:'לא מאומת — בדוק'};
  document.getElementById('brlist').innerHTML =
    `<p class="hint">מוצגות ${list.length} מתוך ${QS.length} שאלות.</p>` +
    (list.length ? list.map(q=>{
      const r = st[q.id];
      const tag = q.conf==='high' ? '' : `<span class="tag ${q.conf}">${confLabel[q.conf]}</span>`;
      const seen = r?.seen ? `<span class="tag">נכון ${r.right} · טעות ${r.wrong}</span>` : '';
      return `<article class="qcard">
        <div class="meta"><span>שאלה #${q.id}</span><span>${esc(q.topic)}${tag}${seen}</span></div>
        <div class="qtext">${esc(q.q)}</div>
        <ol class="opts">${q.opts.map((o,i)=>{
          const hit = !brHide && i===q.correct;
          return `<li><div class="opt${hit?' correct':''}"><span class="k">${KEYS[i]}.</span><span>${esc(o)}</span></div></li>`;
        }).join('')}</ol>
        ${brHide ? '' : `<div class="why${q.conf!=='high'?' unver':''}">${esc(q.why)}
          <span class="src">מקור: ${esc(q.src)}</span></div>`}
      </article>`;
    }).join('') : '<p>אין שאלה שתואמת את הסינון.</p>');
}

function modeName(){ return {practice:'תרגול', exam:'סימולציית מבחן', review:'חזרה על טעויות'}[mode] }
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) }

document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if(mode==='stats' || mode==='browse') return;
  if(e.key>='1' && e.key<='4') pick(+e.key-1);
  else if(e.key==='Enter'){ const n=document.getElementById('next'); if(n && !n.disabled) next() }
  else if(e.key==='f'){ const f=document.getElementById('flag'); if(f){ f.checked=!f.checked; f.onchange({target:f}) } }
});

start();
</script>
</body>
